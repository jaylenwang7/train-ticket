  tsUiDashboard:
    readinessProbe:
      tcpSocket:
        port: 8080
      initialDelaySeconds: 5
      periodSeconds: 1
      failureThreshold: 30
      timeoutSeconds: 2
    name: ts-ui-dashboard
    secretRef: ts-ui-dashboard
    type: NodePort
    nodePort: 30080
    nginx:
      errorLogLevel: warn  # Set to error, warn, info, debug as needed
    opentelemetry:
      enabled: "ON"
      exporter: "otlp"
      endpoint: "opentelemetry-collector-deployment:4317"
      serviceName: "Gateway"
      serviceNamespace: "Gateway"
      serviceInstanceId: "Nginx"
      resolveBackends: "ON"
      traceAsError: "OFF"
  tsUserService:
    name: ts-user-service
    secretRef: ts-user-service
  tsVerificationCodeService:
    name: ts-verification-code-service
    secretRef: ts-verification-code-service
  tsVoucherService:
